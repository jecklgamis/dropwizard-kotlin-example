name: Perf Test
on:
  workflow_dispatch:
jobs:
  perf-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Install resonate
        run: go install github.com/jecklgamis/resonate/cmd/resonate@latest
      - name: generate-build-info.sh
        run: ./generate-build-info.sh
      - name: Build with Maven
        run: mvn --batch-mode -DskipTests package
      - name: Start app
        run: |
          nohup java -jar target/dropwizard-kotlin-example.jar server src/main/resources/config.yaml > app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/ && break; sleep 1; done
      - name: Run load test
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          ./run-perf-tests.sh
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-test-report
          path: perf-tests/*-report.*
